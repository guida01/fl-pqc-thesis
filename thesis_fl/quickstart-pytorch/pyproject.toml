[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quickstart-pytorch"
version = "1.1.1"
description = "Federated Learning with PyTorch and Flower (Quickstart Example)"
license = {file = "LICENSE"}
dependencies = [
    "flwr[simulation]>=1.29.0",
    "flwr-datasets[vision]>=0.6.0",
    "torch==2.8.0",
    "torchvision==0.23.0",
    "liboqs-python==0.16.0",
    "cryptography==46.0.7",
    "numpy==2.4.4",
    "pandas>=1.3.0",
    "matplotlib>=3.4.0",
]

[project.optional-dependencies]
# Not part of the experiment's runtime environment (`flwr run` only
# installs `dependencies` above) — needed only for tests/ and the scipy
# stats used by analysis/validate_results.py. Install with `pip install
# -e ".[dev]"`. Pins match requirements-frozen.txt.
dev = [
    "pytest==9.1.1",
    "scipy==1.17.1",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "flwrlabs"
fab-format-version = 1
flwr-version-target = "1.29.0"

[tool.flwr.app.components]
serverapp = "pytorchexample.server_app:app"
clientapp = "pytorchexample.client_app:app"

[tool.flwr.app.config]
num-server-rounds = 30
fraction-evaluate = 0.0
local-epochs = 1
learning-rate = 0.1
batch-size = 32
scheme = "no_signature"
run-number = 1
num-supernodes = 5
results-dir = "results_final_5clients"
tamper-node-index = -1
eval-central = true
